<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Squad STX Scorecard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style id="app-css">
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#E7EBF3; --ink:#152040; --ink2:#57627C;
  --line:#CFD6E4; --accent:#1F4E9C; --accent-ink:#FFFFFF; --accent-soft:#DCE6F5;
  --go:#2563B0; --go-ink:#FFFFFF; --nogo:#C22E2C; --nogo-ink:#FFFFFF;
  --gold:#B08E22; --gold-soft:#F4EACB; --chip:#ECEFF6; --shadow:0 1px 3px rgba(21,32,64,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1426; --surface:#152039; --surface2:#1D2B4E; --ink:#E9EDF6; --ink2:#98A5C4;
    --line:#2B3A61; --accent:#6C97E4; --accent-ink:#0A1224; --accent-soft:#22375F;
    --go:#5E93E0; --go-ink:#0A1224; --nogo:#E05A50; --nogo-ink:#240B08;
    --gold:#D9B34A; --gold-soft:#3A331C; --chip:#212F53; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1426; --surface:#152039; --surface2:#1D2B4E; --ink:#E9EDF6; --ink2:#98A5C4;
  --line:#2B3A61; --accent:#6C97E4; --accent-ink:#0A1224; --accent-soft:#22375F;
  --go:#5E93E0; --go-ink:#0A1224; --nogo:#E05A50; --nogo-ink:#240B08;
  --gold:#D9B34A; --gold-soft:#3A331C; --chip:#212F53; --shadow:0 1px 3px rgba(0,0,0,.5);
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
#app{max-width:780px;margin:0 auto;padding:14px 14px 90px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.disp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.05em}
header.top{display:flex;align-items:center;gap:14px;padding:8px 2px 14px}
.brand{flex:1;min-width:0}
.brand h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.brand .sub{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-top:5px}
.syncdot{white-space:nowrap;color:var(--accent);font-weight:600}
.logo{flex:none;background:#FFFFFF;border:1px solid var(--line);box-shadow:var(--shadow)}
.l506{width:56px;height:56px;border-radius:50%;object-fit:cover}
.ldog{width:96px;height:56px;border-radius:10px;object-fit:contain;padding:3px 5px}
@media (max-width:560px){.l506{width:42px;height:42px}.ldog{width:70px;height:42px;padding:2px 3px}}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--surface2);padding:5px;border-radius:10px;margin-bottom:16px}
.tabs button{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.07em;padding:10px 4px;border-radius:7px;color:var(--ink2)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.card h2 small{color:var(--ink2);font-weight:500;font-size:13px;letter-spacing:.1em;margin-left:8px}
.formrow{display:flex;flex-wrap:wrap;gap:12px}
.field{flex:1 1 200px;display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2)}
.field select,.field input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.field select{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.datechip{align-self:flex-start;font-size:13px;color:var(--ink2);padding:12px 0}
.secbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-bottom:14px}
.secbtns button{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.08em;padding:18px 6px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:3px}
.secbtns button .tag{font-family:'Public Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--ink2);text-transform:uppercase}
.secbtns button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.secbtns button.on .tag{color:var(--accent-ink);opacity:.75}
.rubricnote{font-size:12px;color:var(--ink2);font-style:italic;margin:-4px 0 12px}
.roundtoggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:5px;border-radius:10px;margin-bottom:14px}
.roundtoggle button{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.08em;padding:10px;border-radius:7px;color:var(--ink2)}
.roundtoggle button.on{background:var(--accent);color:var(--accent-ink)}
.ghead{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.11em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:6px 10px;margin-top:14px}
.ghead:first-of-type{margin-top:2px}
.ghead + .item{border-top:none}
.rubhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:18px 0 4px}
.rubhead:first-of-type{margin-top:6px}
.rubtitle{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.06em}
.rubsub{font-size:11px;color:var(--ink2);margin-top:1px}
.rubstat{display:flex;align-items:center;gap:10px}
.rubgo{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
.rubhead + .item{border-top:none}
.repitems .num{color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}
.rating{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;padding:0 8px}
.rating.T{background:var(--go);color:var(--go-ink)}
.rating.P{background:var(--gold);color:#fff}
.rating.U{background:var(--nogo);color:var(--nogo-ink)}
.rating.pend{background:var(--surface2);color:var(--ink2)}
.item{display:flex;flex-direction:column;gap:8px;padding:13px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none;padding-top:2px}
.item .iname{font-weight:600;font-size:14px}
.item .iname .num{color:var(--ink2);font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.item .idesc{font-size:12.5px;color:var(--ink2);margin-top:2px}
.scale{display:flex;gap:5px;flex-wrap:wrap}
.scale button{min-width:44px;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--chip);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.scale button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gng{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:260px}
.gng button{min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--chip);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
.gng button.go.on{background:var(--go);color:var(--go-ink);border-color:var(--go)}
.gng button.nogo.on{background:var(--nogo);color:var(--nogo-ink);border-color:var(--nogo)}
textarea.notes{width:100%;min-height:74px;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;margin-top:4px}
.savebar{position:sticky;bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.18);margin-top:14px}
.savebar .score{font-variant-numeric:tabular-nums}
.savebar .score b{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.savebar .score span{display:block;font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.1em}
.savebar .draft{font-size:11px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.savebtn{background:var(--accent);color:var(--accent-ink);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.08em;padding:12px 22px;border-radius:9px;white-space:nowrap}
.savebtn:disabled{opacity:.5;cursor:default}
.lastsave{font-size:12px;color:var(--ink2);margin-top:10px}
.tablewrap{overflow-x:auto}
table.rank{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:560px}
table.rank th{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);text-align:right;padding:8px 7px;white-space:nowrap;border-bottom:2px solid var(--line)}
table.rank th:nth-child(1),table.rank th:nth-child(2){text-align:left}
table.rank td{padding:11px 7px;white-space:nowrap;border-bottom:1px solid var(--line);text-align:right;font-size:14.5px}
table.rank td:nth-child(1),table.rank td:nth-child(2){text-align:left}
table.rank td.total{font-weight:700;font-size:16px}
table.rank tr.first td{background:var(--gold-soft)}
table.rank td .rk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--surface2);font-weight:700;font-size:13px}
table.rank tr.first td .rk{background:var(--gold);color:#fff}
table.rank .sqname{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.dim{color:var(--ink2)}
.formula{font-size:12.5px;color:var(--ink2);margin-top:12px;line-height:1.6}
.formula code{font-family:inherit;background:var(--surface2);padding:1px 6px;border-radius:5px;white-space:nowrap}
.sqchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.sqchips button{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:9px 15px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.sqchips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rephead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rephead .pct{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.repmeta{font-size:12px;color:var(--ink2);margin-bottom:10px}
ul.repitems{list-style:none}
ul.repitems li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
ul.repitems li:first-child{border-top:none}
ul.repitems .res{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
ul.repitems .res.go{color:var(--go)}
ul.repitems .res.nogo{color:var(--nogo)}
.repnotes{font-size:13px;color:var(--ink2);border-left:3px solid var(--line);padding:4px 0 4px 10px;margin-top:10px;white-space:pre-wrap}
.empty{color:var(--ink2);font-size:13.5px;font-style:italic}
.banner{background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink);font-size:13px;border-radius:10px;padding:10px 14px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:520px){.brand h1{font-size:24px}.secbtns button{font-size:19px;padding:14px 4px 11px}}
</style>
<div id="app"></div>
<div id="toast" role="status"></div>
<script id="app-state" type="application/json">{"squads":{}}</script>
<script src="/rubrics.js"></script>

/* ---------- configuration (public/rubrics.js) ---------- */
var CFG = window.STX_CONFIG;
var TLP = CFG.TLP, TLP_ITEMS = TLP.items, LANES = CFG.TASKS, GRADE_TABS = CFG.GRADE_TABS;
var SQUADS = CFG.SQUADS, SQUAD_NAMES = CFG.SQUAD_NAMES;
var TLP_CRITS = TLP_ITEMS.filter(function(it){ return it.crit; }).length;
/* Every measure on every sheet is GO (1) or NO-GO (0). */
var SECTION_IDS = ["tlp"].concat(LANES.map(function(l){ return l.id; }));
var LANE_BY_ID = {};
LANES.forEach(function(l){ LANE_BY_ID[l.id] = l; });
function isLane(sec){ return sec !== "tlp"; }
function secDef(sec){ return sec === "tlp" ? TLP : LANE_BY_ID[sec]; }
function sectionItems(sec){
  if(!isLane(sec)) return TLP_ITEMS;
  var all = [];
  (LANE_BY_ID[sec].rubrics || []).forEach(function(r){ all = all.concat(r.items); });
  return all;
}
/* Weights sum to 1.00, so the total is out of 100. TLP takes TLP_WEIGHT; lanes share
   the rest in proportion to their optional "weight" (default 1 = equal split). */
var W = (function(){
  var w = {};
  if(!LANES.length){ w.tlp = 1; return w; }
  w.tlp = CFG.TLP_WEIGHT;
  var sum = 0;
  LANES.forEach(function(l){ sum += (l.weight > 0 ? l.weight : 1); });
  LANES.forEach(function(l){ w[l.id] = (1 - CFG.TLP_WEIGHT) * (l.weight > 0 ? l.weight : 1) / sum; });
  return w;
})();

/* ---------- state ---------- */
var stateEl = document.getElementById("app-state");
var state; try { state = JSON.parse(stateEl.textContent); } catch(e){ state = {squads:{}}; }
if(!state.squads) state.squads = {};

var ui = {tab:"grade", squad:SQUADS[0], gtab:null, rsquad:SQUADS[0]};
try { var u = JSON.parse(sessionStorage.getItem("stx.ui")||"null"); if(u) ui = Object.assign(ui,u); } catch(e){}
function gradeTab(id){ return GRADE_TABS.filter(function(t){ return t.id === id; })[0] || null; }
if(ui.gtab && !gradeTab(ui.gtab)) ui.gtab = null;
var drafts = {};
try { drafts = JSON.parse(sessionStorage.getItem("stx.drafts")||"{}") || {}; } catch(e){}
Object.keys(drafts).forEach(function(k){ if(SECTION_IDS.indexOf(k.split("|")[1]) < 0) delete drafts[k]; });
var evaluator = "";
try { evaluator = localStorage.getItem("stx.evaluator") || ""; } catch(e){}

var online = false, saving = false;

/* discard drafts already identical to saved data */
function cleanDrafts(){
  var changed = false;
  Object.keys(drafts).forEach(function(k){
    var p = k.split("|"), saved = getSaved(p[0], p[1]);
    if(saved && sameData(drafts[k].data, saved)){ delete drafts[k]; changed = true; }
  });
  if(changed) persistDrafts();
}
cleanDrafts();

function fetchState(){
  return fetch("/api/state").then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  });
}
function adoptState(st){
  if(st && st.squads) state = st;
}
fetchState().then(function(st){
  adoptState(st); online = true; cleanDrafts(); render();
}).catch(function(){ online = false; refreshSyncDot(); });

/* live sync: refresh every 12s; hold the re-render while the evaluator is typing */
setInterval(function(){
  fetchState().then(function(st){
    online = true;
    var changed = JSON.stringify(st) !== JSON.stringify(state);
    if(changed){
      adoptState(st); cleanDrafts();
      var ae = document.activeElement;
      var typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA");
      if(!typing) render();
    }
    refreshSyncDot();
  }).catch(function(){ online = false; refreshSyncDot(); });
}, 12000);

var TEXT_FIELDS = ["notes","sustain","improve","slName","orderTime","metric"];
function getSaved(sq, sec){ return (state.squads[sq]||{})[sec] || null; }
function draftKey(sq, sec){ return sq+"|"+sec; }
function canonData(x){
  var s = x.scores || {};
  var flat = Object.keys(s).sort().map(function(k){ return k+":"+s[k]; }).join(",");
  return JSON.stringify([flat].concat(TEXT_FIELDS.map(function(f){ return x[f] || ""; })));
}
function sameData(a, b){
  if(!a || !b) return false;
  return canonData(a) === canonData(b);
}
function getWorking(sq, sec){
  var d = drafts[draftKey(sq,sec)];
  if(d) return d.data;
  var saved = getSaved(sq, sec) || {};
  var w = {scores: Object.assign({}, saved.scores || {})};
  TEXT_FIELDS.forEach(function(f){ w[f] = saved[f] || ""; });
  return w;
}
function setWorking(sq, sec, data){
  drafts[draftKey(sq,sec)] = {data:data, ts:Date.now()};
  persistDrafts();
}
function hasDraft(sq, sec){
  var d = drafts[draftKey(sq,sec)];
  if(!d) return false;
  var saved = getSaved(sq, sec);
  return !(saved && sameData(d.data, saved));
}
function persistDrafts(){ try{ sessionStorage.setItem("stx.drafts", JSON.stringify(drafts)); }catch(e){} }
function persistUi(){ try{ sessionStorage.setItem("stx.ui", JSON.stringify(ui)); }catch(e){} }

/* ---------- scoring ---------- */
function rawOf(sec, data){
  var items = sectionItems(sec), sum = 0, rated = 0;
  items.forEach(function(it){
    var v = data.scores ? data.scores[it.id] : undefined;
    if(v === 0 || v === 1){ sum += v; rated++; }
  });
  return {sum:sum, rated:rated, count:items.length};
}
function maxOf(sec){ return sectionItems(sec).length; }
/* T&EO objective task evaluation matrix, applied to one rubric's GO/NO-GO scores:
   performance measures >=80% GO, 65-79%, <65% -> T/P/U;
   critical measures: all GO -> T, any NO-GO -> P at best;
   leader measures >=85%, 75-84%, <=74% -> T/P/U. Overall = worst of the three.
   Returns null until every measure in the rubric is rated. */
function teoRating(rubric, data){
  if(!data || !rubric.teo || !rubric.items.length) return null;
  var scores = data.scores || {};
  var pass = function(it){ return scores[it.id] === 1; };
  var allRated = rubric.items.every(function(it){ return scores[it.id] === 0 || scores[it.id] === 1; });
  if(!allRated) return null;
  var total = rubric.items.length;
  var go = rubric.items.filter(pass).length;
  var crits = rubric.items.filter(function(it){ return it.crit; });
  var ldrs = rubric.items.filter(function(it){ return it.ldr; });
  var pmPct = go / total * 100;
  var ldrPct = ldrs.length ? ldrs.filter(pass).length / ldrs.length * 100 : 100;
  var critAll = crits.every(pass);
  var tiers = [
    pmPct >= 80 ? 0 : pmPct >= 65 ? 1 : 2,
    critAll ? 0 : 1,
    ldrPct >= 85 ? 0 : ldrPct >= 75 ? 1 : 2
  ];
  return ["T","P","U"][Math.max.apply(null, tiers)];
}
function rubricPts(rubric, data){
  var scores = (data && data.scores) || {};
  return {pts: rubric.items.filter(function(it){ return scores[it.id] === 1; }).length, max: rubric.items.length};
}
function pctOf(sec, data){
  if(!data) return null;
  var max = maxOf(sec);
  return max ? rawOf(sec, data).sum / max * 100 : null;
}
/* Time: recon, attack and ambush each record total minutes on the lane (required to save).
   A task's own score is simply its GO percentage; time enters only in the final score. */
function metricOf(sec, d){
  var m = isLane(sec) ? LANE_BY_ID[sec].metric : null;
  if(!m || !d) return null;
  return CFG.parseMinutes(d.metric);
}
var TIMED = LANES.filter(function(l){ return l.metric; }).map(function(l){ return l.id; });
function fastest(sec){
  var best = null;
  SQUADS.forEach(function(sq){
    var v = metricOf(sec, getSaved(sq, sec));
    if(v !== null && (best === null || v < best)) best = v;
  });
  return best;
}
function sectionScore(sq, sec){ return pctOf(sec, getSaved(sq, sec)); }
/* Total minutes across the timed tasks. complete = every timed task has a saved time. */
function timeOf(sq){
  var sum = 0, n = 0;
  TIMED.forEach(function(sec){
    var v = metricOf(sec, getSaved(sq, sec));
    if(v !== null){ sum += v; n++; }
  });
  return {sum:sum, n:n, complete: n === TIMED.length && n > 0};
}
/* T/P/U per the grading standard: U = any critical NO-GO; T = all criticals GO and
   >= threshold GO; P = all criticals GO but fewer. null until fully rated. */
function tlpRating(data){
  if(!data) return null;
  var scores = data.scores || {};
  var anyCritNoGo = TLP_ITEMS.some(function(it){ return it.crit && scores[it.id] === 0; });
  if(anyCritNoGo) return "U";
  var allRated = TLP_ITEMS.every(function(it){ return scores[it.id] === 0 || scores[it.id] === 1; });
  if(!allRated) return null;
  var goCount = TLP_ITEMS.filter(function(it){ return scores[it.id] === 1; }).length;
  return goCount >= TLP.tThreshold ? "T" : "P";
}
function critGoCount(data){
  var scores = (data && data.scores) || {};
  return TLP_ITEMS.filter(function(it){ return it.crit && scores[it.id] === 1; }).length;
}
/* Weighted GO percentage across all sheets (0-100). Sheets not yet saved count as all NO-GO. */
function compositeOf(sq){
  var any = false, total = 0;
  SECTION_IDS.forEach(function(sec){
    var s = sectionScore(sq, sec);
    if(s !== null){ any = true; total += s * W[sec]; }
  });
  return any ? total : null;
}
/* FINAL SCORE — lower is better.
   final = total minutes on the timed lanes x (1 + NO-GO share),
   where NO-GO share = 1 - weighted GO percentage / 100.
   All GO leaves the raw time; every NO-GO inflates it, up to double.
   null until every timed lane has a saved time. */
function finalOf(sq){
  var t = timeOf(sq);
  if(!t.complete) return null;
  var go = compositeOf(sq) || 0;
  return t.sum * (2 - go / 100);
}
function allSaved(sq){ return SECTION_IDS.every(function(sec){ return !!getSaved(sq, sec); }); }
function fmtMin(v){ return (Math.round(v * 100) / 100).toString(); }
function fmt(v, dec){ return v===null||v===undefined ? "—" : v.toFixed(dec===undefined?1:dec); }
function pctTxt(w){ return (Math.round(w * 1000) / 10) + "%"; }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function squadName(sq){ return SQUAD_NAMES[sq] || ("Squad "+sq); }
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 3200);
}
function fmtWhen(iso){
  try { var d = new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return iso; }
}
function refreshSyncDot(){
  var el = document.getElementById("syncdot");
  if(!el) return;
  el.textContent = saving ? "saving…" : (online ? "live sync" : "offline / retrying");
}

/* ---------- rendering ---------- */
var app = document.getElementById("app");

function render(){
  var html = "";
  html += '<header class="top"><img class="logo l506" src="'+LOGO_506+'" alt="506th Infantry Regiment insignia"><div class="brand"><h1>'+esc(CFG.TITLE)+'</h1><div class="sub">'+esc(CFG.UNIT)+' · External Evaluator Console · <span class="syncdot" id="syncdot"></span></div></div><img class="logo ldog" src="'+LOGO_DOG+'" alt="Dog Company patch"></header>';
  html += '<nav class="tabs" role="tablist">';
  [["grade","Grade"],["rank","Rankings"],["report","Reports"]].forEach(function(t){
    html += '<button role="tab" data-act="tab" data-val="'+t[0]+'" class="'+(ui.tab===t[0]?"on":"")+'" aria-selected="'+(ui.tab===t[0])+'">'+t[1]+'</button>';
  });
  html += '</nav>';
  if(ui.tab==="grade") html += renderGrade();
  else if(ui.tab==="rank") html += renderRank();
  else html += renderReport();
  app.innerHTML = html;
  refreshSyncDot();
}

function renderGrade(){
  var html = "";
  var pendingDrafts = Object.keys(drafts).filter(function(k){ var p=k.split("|"); return hasDraft(p[0],p[1]); });
  if(pendingDrafts.length){
    html += '<div class="banner">Unsaved scores on this device: '+pendingDrafts.map(function(k){
      var p=k.split("|"); return esc(squadName(p[0]))+" – "+esc(secDef(p[1]).label);
    }).join(", ")+'. Open the tab that holds that sheet and press Save to send them to the rankings.</div>';
  }
  html += '<section class="card"><h2>Admin Data</h2><div class="formrow">';
  html += '<div class="field"><label for="sqsel">Squad being evaluated</label><select id="sqsel" data-act="squad">';
  SQUADS.forEach(function(s){ html += '<option value="'+s+'"'+(ui.squad===s?" selected":"")+'>'+esc(squadName(s))+'</option>'; });
  html += '</select></div>';
  html += '<div class="field"><label for="evname">Evaluator</label><input id="evname" data-act="evname" type="text" autocomplete="off" placeholder="Rank / name" value="'+esc(evaluator)+'"></div>';
  html += '<div class="field" style="flex:0 1 auto"><label>Date</label><div class="datechip">'+new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})+'</div></div>';
  html += '</div></section>';

  html += '<div class="secbtns">';
  GRADE_TABS.forEach(function(t){
    var dirty = t.tasks.some(function(sec){ return hasDraft(ui.squad, sec); });
    html += '<button data-act="gtab" data-val="'+t.id+'" class="'+(ui.gtab===t.id?"on":"")+'">'+esc(t.label)+(dirty?" ●":"")+'<span class="tag">'+esc(t.tag||"")+'</span></button>';
  });
  html += '</div>';

  var gt = gradeTab(ui.gtab);
  if(gt){
    html += '<p class="rubricnote" style="margin:0 2px 12px">Every measure is rated GO or NO-GO. Save sends every sheet on this tab that you have changed.</p>';
    var sum = 0, max = 0, rated = 0, dirtyAny = false;
    gt.tasks.forEach(function(sec){
      html += renderSheet(sec);
      var r = rawOf(sec, getWorking(ui.squad, sec));
      sum += r.sum; rated += r.rated; max += r.count;
      if(hasDraft(ui.squad, sec)) dirtyAny = true;
    });
    html += '<div class="savebar"><div class="score"><b>'+sum+' / '+max+' GO</b><span>'+esc(gt.label)+' · '+esc(squadName(ui.squad))
         + ((max-rated) ? ' · '+(max-rated)+' unrated' : '')+'</span>'
         + (dirtyAny ? '<span class="draft">Unsaved changes</span>' : '')
         + '</div><button class="savebtn" data-act="save" data-tab="'+gt.id+'"'+(saving?" disabled":"")+'>'+(saving?"Saving…":"Save → Rankings")+'</button></div>';
  }
  return html;
}

function renderItems(sec, items, groups, data){
  var html = "", lastGroup = null;
  items.forEach(function(it, i){
    var v = data.scores[it.id];
    if(groups && it.g !== lastGroup){
      lastGroup = it.g;
      html += '<div class="ghead">'+esc(groups[it.g])+'</div>';
    }
    var numTxt = it.num ? it.num : String(i+1).padStart(2,"0");
    html += '<div class="item"><div><div class="iname"><span class="num">'+esc(numTxt)+'</span>'+esc(it.name)
         + '</div><div class="idesc">'+esc(it.d)+'</div></div>';
    html += '<div class="gng">';
    html += '<button class="go '+(v===1?"on":"")+'" data-act="rate" data-sec="'+sec+'" data-item="'+it.id+'" data-val="1" aria-pressed="'+(v===1)+'">Go</button>';
    html += '<button class="nogo '+(v===0?"on":"")+'" data-act="rate" data-sec="'+sec+'" data-item="'+it.id+'" data-val="0" aria-pressed="'+(v===0)+'">No-Go</button>';
    html += '</div></div>';
  });
  return html;
}

function metricChipText(sec){
  var best = fastest(sec);
  return best === null ? "—" : fmtMin(best) + " min";
}

/* One task's grade sheet (a card). The tab's single save bar is rendered by renderGrade. */
function renderSheet(sec){
  var def = secDef(sec);
  var sq = ui.squad;
  var data = getWorking(sq, sec);
  var saved = getSaved(sq, sec);
  var html = '<section class="card">';
  if(!isLane(sec)){
    var rating = tlpRating(data), r = rawOf(sec, data);
    html += '<div class="rubhead"><div><div class="rubtitle">'+esc(def.title)+'</div><div class="rubsub">'+esc(def.sub||"")+'</div></div><div class="rubstat"><span class="rating '+(rating||"pend")+'">'+(rating||"—")+'</span><span class="rubgo">'+r.sum+' / '+r.count+' GO</span></div></div>';
    html += '<p class="rubricnote" style="margin:10px 0 12px">'+esc(def.note)+' Time standard: order briefed in 45 minutes or less.</p>';
    html += '<div class="formrow" style="margin-bottom:8px">';
    html += '<div class="field"><label for="slname">Squad leader</label><input id="slname" data-act="field" data-field="slName" data-sec="tlp" type="text" autocomplete="off" placeholder="Rank / name" value="'+esc(data.slName)+'"></div>';
    html += '<div class="field"><label for="ordertime">Time of order (min)</label><input id="ordertime" data-act="field" data-field="orderTime" data-sec="tlp" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 40" value="'+esc(data.orderTime)+'"></div>';
    html += '</div>';
    html += renderItems(sec, def.items, def.groups, data);
    html += '<div class="field" style="margin-top:10px"><label for="sustain">Sustain — what the squad leader did well</label><textarea id="sustain" class="notes" data-act="field" data-field="sustain" data-sec="tlp">'+esc(data.sustain)+'</textarea></div>';
    html += '<div class="field" style="margin-top:10px"><label for="improve">Improve — specific and actionable, tied to measure numbers</label><textarea id="improve" class="notes" data-act="field" data-field="improve" data-sec="tlp">'+esc(data.improve)+'</textarea></div>';
  } else {
    def.rubrics.forEach(function(rubric, ri){
      var rg = rubricPts(rubric, data);
      var rate = teoRating(rubric, data);
      html += '<div class="rubhead"><div><div class="rubtitle">'+esc(rubric.title)+'</div><div class="rubsub">'+esc(rubric.sub||"")+'</div></div><div class="rubstat">'+(rubric.teo?'<span class="rating '+(rate||"pend")+'">'+(rate||"—")+'</span>':'')+'<span class="rubgo">'+rg.pts+' / '+rg.max+' GO</span></div></div>';
      if(ri === 0 && def.metric){
        var m = def.metric;
        html += '<div class="formrow" style="margin:12px 0 8px">';
        html += '<div class="field"><label for="metric-'+sec+'">'+esc(m.label)+(m.unit?' ('+esc(m.unit)+')':'')+' — required</label><input id="metric-'+sec+'" data-act="field" data-field="metric" data-sec="'+sec+'" type="text" inputmode="decimal" autocomplete="off" placeholder="minutes, e.g. 47.5" value="'+esc(data.metric)+'"></div>';
        html += '<div class="field" style="flex:0 1 auto"><label>Fastest saved</label><div class="datechip" style="font-weight:700;font-variant-numeric:tabular-nums">'+esc(metricChipText(sec))+'</div></div>';
        html += '</div>';
      }
      html += renderItems(sec, rubric.items, rubric.groups, data);
    });
    html += '<textarea class="notes" data-act="field" data-field="notes" data-sec="'+sec+'" placeholder="Evaluator notes / sustains & improves…">'+esc(data.notes)+'</textarea>';
  }
  if(saved) html += '<div class="lastsave">Last saved '+fmtWhen(saved.savedAt)+(saved.savedBy?' by '+esc(saved.savedBy):"")+'.</div>';
  html += '</section>';
  return html;
}

function formulaText(){
  var parts = SECTION_IDS.map(function(sec){ return esc(secDef(sec).label)+' × '+pctTxt(W[sec]); });
  return '<b>Lowest score wins.</b> <code>Score = total time × (1 + NO-GO share)</code>. '
    + 'Total time is the minutes on '+TIMED.map(function(sec){ return esc(secDef(sec).label); }).join(', ')+' added together. '
    + 'NO-GO share is <code>1 − weighted GO %</code>, with GO % weighted '+parts.map(function(x){ return '<code>'+x+'</code>'; }).join(' + ')+'. '
    + 'A squad that is all GO keeps its raw time; every NO-GO inflates it, up to double. '
    + 'A squad is ranked once all '+TIMED.length+' times are saved; sheets not yet saved count as NO-GO, and a score marked * is still missing a sheet. '
    + 'Rankings update for everyone the moment an evaluator saves.';
}

function renderRank(){
  var rows = SQUADS.map(function(sq){
    var row = {sq:sq, go:compositeOf(sq), time:timeOf(sq), score:finalOf(sq), s:{}};
    SECTION_IDS.forEach(function(sec){ row.s[sec] = sectionScore(sq, sec); });
    return row;
  });
  rows.sort(function(a,b){
    if(a.score===null && b.score===null) return SQUADS.indexOf(a.sq) - SQUADS.indexOf(b.sq);
    if(a.score===null) return 1;
    if(b.score===null) return -1;
    return a.score - b.score;
  });
  var html = '<section class="card"><h2>Live Squad Rankings<small>lowest score wins</small></h2><div class="tablewrap"><table class="rank" style="min-width:'+(410+SECTION_IDS.length*62)+'px">';
  html += '<thead><tr><th>#</th><th>Squad</th><th>Score</th><th>Time</th><th>GO %</th>';
  SECTION_IDS.forEach(function(sec){ html += '<th>'+esc(secDef(sec).label)+'</th>'; });
  html += '</tr></thead><tbody>';
  var rank = 0, prevShown = null;
  rows.forEach(function(r, i){
    var ranked = r.score!==null;
    if(ranked){
      var shown = r.score.toFixed(1);
      if(shown !== prevShown) rank = i+1; /* tied scores share a rank */
      prevShown = shown;
    }
    html += '<tr class="'+(ranked && rank===1 ? "first":"")+'">';
    html += '<td>'+(ranked?'<span class="rk">'+rank+'</span>':'<span class="dim">—</span>')+'</td>';
    html += '<td class="sqname">'+esc(squadName(r.sq))+'</td>';
    html += '<td class="total'+(ranked?'':' dim')+'">'+fmt(r.score)+(ranked && !allSaved(r.sq)?'*':'')+'</td>';
    html += '<td'+(r.time.n?'':' class="dim"')+'>'+(r.time.n ? fmtMin(r.time.sum)+(r.time.complete?'':' <span class="dim">('+r.time.n+'/'+TIMED.length+')</span>') : '—')+'</td>';
    html += '<td'+(r.go===null?' class="dim"':'')+'>'+fmt(r.go)+'</td>';
    SECTION_IDS.forEach(function(sec){
      var v = r.s[sec];
      var trate = sec==="tlp" ? tlpRating(getSaved(r.sq, "tlp")) : null;
      html += '<td'+(v===null?' class="dim"':'')+'>'+fmt(v)+(trate?' <span class="dim">'+trate+'</span>':'')+'</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<p class="formula">'+formulaText()+'</p>';
  html += '</section>';
  return html;
}

function repItemsHtml(items, saved){
  var html = '<ul class="repitems">';
  items.forEach(function(it){
    var v = saved.scores ? saved.scores[it.id] : undefined;
    var res = v===1 ? '<span class="res go">GO</span>' : v===0 ? '<span class="res nogo">NO-GO</span>' : '<span class="res dim">—</span>';
    html += '<li><span>'+(it.num?'<span class="num">'+esc(it.num)+'</span> ':'')+esc(it.name)+'</span>'+res+'</li>';
  });
  return html + '</ul>';
}

function renderReport(){
  var html = '<section class="card"><h2>Squad Report</h2><div class="sqchips">';
  SQUADS.forEach(function(s){
    html += '<button data-act="rsquad" data-val="'+s+'" class="'+(ui.rsquad===s?"on":"")+'">'+esc(squadName(s))+'</button>';
  });
  html += '</div></section>';
  var sq = ui.rsquad;
  SECTION_IDS.forEach(function(sec){
    var def = secDef(sec);
    var saved = getSaved(sq, sec);
    var max = maxOf(sec);
    html += '<section class="card">';
    if(!saved || !max){
      html += '<h2>'+esc(def.full)+'</h2><p class="empty">'+(max?"Not yet evaluated.":"Rubric not loaded for this task yet.")+'</p></section>';
      return;
    }
    var r = rawOf(sec, saved);
    var rate = sec==="tlp" ? tlpRating(saved) : null;
    html += '<div class="rephead"><h2 style="margin-bottom:0">'+esc(def.full)+'</h2><span class="pct">'+(rate?'<span class="rating '+rate+'">'+rate+'</span> ':'')+sectionScore(sq, sec).toFixed(1)+'%</span></div>';
    var metricTxt = '';
    if(isLane(sec) && def.metric){
      var mv = metricOf(sec, saved);
      metricTxt = ' · '+esc(def.metric.label.toLowerCase())+' '+(mv===null ? 'not entered' : fmtMin(mv)+' min');
    }
    html += '<div class="repmeta">'+r.sum+' / '+max+' GO · weight '+pctTxt(W[sec])
         + metricTxt
         + (sec==="tlp" ? ''
            + (saved.slName ? ' · SL: '+esc(saved.slName) : '')
            + (saved.orderTime ? ' · order: '+esc(saved.orderTime)+' min' : '') : '')
         + ' · saved '+fmtWhen(saved.savedAt)+(saved.savedBy?' by '+esc(saved.savedBy):"")+'</div>';
    if(isLane(sec)){
      def.rubrics.forEach(function(rubric){
        var rg = rubricPts(rubric, saved);
        var rrate = teoRating(rubric, saved);
        html += '<div class="rubhead"><div><div class="rubtitle">'+esc(rubric.title)+'</div><div class="rubsub">'+esc(rubric.sub||"")+'</div></div><div class="rubstat">'+(rrate?'<span class="rating '+rrate+'">'+rrate+'</span>':'')+'<span class="rubgo">'+rg.pts+' / '+rg.max+' GO</span></div></div>';
        html += repItemsHtml(rubric.items, saved);
      });
    } else {
      html += repItemsHtml(def.items, saved);
    }
    if(saved.sustain) html += '<div class="repnotes"><b>Sustain:</b> '+esc(saved.sustain)+'</div>';
    if(saved.improve) html += '<div class="repnotes"><b>Improve:</b> '+esc(saved.improve)+'</div>';
    if(saved.notes) html += '<div class="repnotes">'+esc(saved.notes)+'</div>';
    html += '</section>';
  });
  var go = compositeOf(sq), tm = timeOf(sq), fin = finalOf(sq);
  html += '<section class="card"><div class="rephead"><h2 style="margin-bottom:0">Final Score<small>lowest wins</small></h2><span class="pct">'+fmt(fin)+(fin!==null && !allSaved(sq)?'*':'')+'</span></div>';
  html += '<p class="formula">Weighted GO %: '+SECTION_IDS.map(function(sec){ return fmt(sectionScore(sq,sec))+' × '+pctTxt(W[sec]); }).join('&ensp;+&ensp;')+'&ensp;=&ensp;<b>'+fmt(go)+'</b><br>'
       + 'Total time: '+TIMED.map(function(sec){ var v = metricOf(sec, getSaved(sq, sec)); return esc(secDef(sec).label)+' '+(v===null?'—':fmtMin(v)); }).join('&ensp;+&ensp;')+(tm.complete?'&ensp;=&ensp;<b>'+fmtMin(tm.sum)+' min</b>':'')+'<br>'
       + (fin===null ? 'Score appears once all '+TIMED.length+' lane times are saved.'
          : 'Score: '+fmtMin(tm.sum)+' × (1 + '+((100-(go||0))/100).toFixed(3)+')&ensp;=&ensp;<b>'+fmt(fin)+'</b>'+(allSaved(sq)?'':' *  —  a sheet is still unsaved and counts as NO-GO'))
       + '</p></section>';
  return html;
}

/* ---------- save to server ---------- */
function postSheet(sq, sec){
  var data = getWorking(sq, sec);
  var record = {scores: data.scores, savedBy: evaluator || "", savedAt: new Date().toISOString()};
  TEXT_FIELDS.forEach(function(f){ record[f] = data[f] || ""; });
  setWorking(sq, sec, data); /* keep a copy until the server confirms */
  return fetch("/api/section", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({squad: sq, section: sec, data: record})
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(adoptState);
}
/* Saves every sheet on the grading tab that has unsaved changes, one after another. */
function doSave(tabId){
  if(saving) return;
  var gt = gradeTab(tabId); if(!gt) return;
  var sq = ui.squad;
  var todo = gt.tasks.filter(function(sec){ return hasDraft(sq, sec); });
  if(!todo.length){ toast("Nothing new to save on this tab."); return; }
  var missing = todo.filter(function(sec){ return isLane(sec) && LANE_BY_ID[sec].metric && metricOf(sec, getWorking(sq, sec)) === null; });
  if(missing.length){
    toast("Enter the total time on the lane for " + missing.map(function(sec){ return secDef(sec).label; }).join(" and ") + " as a number of minutes, e.g. 47.5 (not 47:30).");
    var f = document.getElementById("metric-" + missing[0]);
    if(f){ f.focus(); f.scrollIntoView({block:"center"}); }
    return;
  }
  saving = true; render();
  var chain = Promise.resolve();
  todo.forEach(function(sec){ chain = chain.then(function(){ return postSheet(sq, sec); }); });
  chain.then(function(){
    online = true; saving = false;
    cleanDrafts(); render();
    toast("Saved \u2014 rankings updated for everyone.");
  }).catch(function(e){
    saving = false; online = false; cleanDrafts(); render();
    toast("Save failed \u2014 check the connection. Your entries are kept; try again.");
  });
}

/* ---------- events ---------- */
app.addEventListener("click", function(ev){
  var btn = ev.target.closest("[data-act]");
  if(!btn) return;
  var act = btn.getAttribute("data-act");
  if(act==="tab"){ ui.tab = btn.getAttribute("data-val"); persistUi(); render(); }
  else if(act==="gtab"){ ui.gtab = btn.getAttribute("data-val"); persistUi(); render(); }
  else if(act==="rate"){
    var sec = btn.getAttribute("data-sec"), item = btn.getAttribute("data-item"), val = parseInt(btn.getAttribute("data-val"),10);
    var data = getWorking(ui.squad, sec);
    if(data.scores[item] === val) delete data.scores[item]; else data.scores[item] = val;
    setWorking(ui.squad, sec, data); render();
  }
  else if(act==="save"){ doSave(btn.getAttribute("data-tab")); }
  else if(act==="rsquad"){ ui.rsquad = btn.getAttribute("data-val"); persistUi(); render(); }
});
app.addEventListener("input", function(ev){
  var el = ev.target.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act");
  if(act==="field"){
    var sec = el.getAttribute("data-sec");
    var fieldName = el.getAttribute("data-field");
    var data = getWorking(ui.squad, sec);
    data[fieldName] = el.value;
    setWorking(ui.squad, sec, data);
    /* update draft chip without full re-render (keeps focus) */
    var bar = app.querySelector(".savebar .score");
    if(bar && !bar.querySelector(".draft") && hasDraft(ui.squad, sec)){
      var s = document.createElement("span"); s.className = "draft"; s.textContent = "Unsaved changes"; bar.appendChild(s);
    }
  } else if(act==="evname"){
    evaluator = el.value;
    try{ localStorage.setItem("stx.evaluator", evaluator); }catch(e){}
  }
});
app.addEventListener("change", function(ev){
  var el = ev.target.closest("[data-act]");
  if(el && el.getAttribute("data-act")==="squad"){ ui.squad = el.value; persistUi(); render(); }
});

render();
})();
</script>
